[project]
name = "olevel-math-score"
version = "1.0.0"
description = "Predicting O-level mathematics scores to identify students who need support before the exam"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
